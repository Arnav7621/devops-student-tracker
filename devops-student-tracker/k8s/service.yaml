apiVersion: v1
kind: Service
metadata:
  name: student-tracker-service
  labels:
    app: student-tracker
    tier: frontend
    project: devops-student-tracker
spec:
  type: NodePort
  selector:
    app: student-tracker
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
